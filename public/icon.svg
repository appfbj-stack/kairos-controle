<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with dark industrial tone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Industrial Engineering Badge Circle -->
  <circle cx="256" cy="256" r="185" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  <circle cx="256" cy="256" r="165" fill="#0f172a"/>

  <!-- 4 Quadrants: Eletrica, Mecanica, Solda, Encanamento -->
  <g transform="translate(256, 256)">
    <!-- Dividing cross lines -->
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#334155" stroke-width="4" stroke-dasharray="6,6"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#334155" stroke-width="4" stroke-dasharray="6,6"/>

    <!-- Top Left: Eletrica (Lightning Spark) -->
    <path d="M -60 -110 L -40 -110 L -65 -65 L -45 -65 L -80 -25 L -70 -70 L -90 -70 Z" fill="#eab308" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))"/>

    <!-- Top Right: Mecanica (Gear / Cogwheel) -->
    <g transform="translate(65, -65) scale(1.1)">
      <circle cx="0" cy="0" r="16" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="7" fill="#0f172a"/>
      <path d="M-4,-24 h8 v6 h-8 z M-4,18 h8 v6 h-8 z M-24,-4 h6 v8 h-6 z M18,-4 h6 v8 h-6 z M-17,-17 l6,6 l-4,4 l-6,-6 z M11,11 l6,6 l-4,4 l-6,-6 z M-17,11 l6,-6 l4,4 l-6,6 z M11,-17 l6,-6 l4,4 l-6,6 z" fill="#94a3b8"/>
    </g>

    <!-- Bottom Left: Solda (Welding Torch Torch flame / Arc) -->
    <g transform="translate(-65, 65)">
      <!-- Welding torch nozzle -->
      <path d="M -22 18 L 10 -14 L 18 -6 L -14 26 Z" fill="#64748b"/>
      <!-- Torch spark / flame -->
      <path d="M 12 -12 Q 28 -28 20 -5 Q 35 2 24 15 Q 8 2 12 -12 Z" fill="#f97316"/>
      <circle cx="26" cy="-10" r="3" fill="#fef08a"/>
      <circle cx="16" cy="-24" r="2" fill="#fef08a"/>
    </g>

    <!-- Bottom Right: Hidráulica / Encanador (Pipe & Water drop) -->
    <g transform="translate(65, 65)">
      <!-- Pipe elbow -->
      <path d="M -20 -15 L -20 15 A 15 15 0 0 0 -5 30 L 25 30 L 25 18 L 0 18 A 3 3 0 0 1 -8 10 L -8 -15 Z" fill="#0284c7"/>
      <!-- Water drop -->
      <path d="M 12 -8 C 12 -8, 2 -20, 2 -28 A 10 10 0 0 1 22 -28 C 22 -20, 12 -8, 12 -8 Z" fill="#38bdf8"/>
    </g>

    <!-- Center Box / Almoxarifado Pallet & Shield -->
    <circle cx="0" cy="0" r="38" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="3"/>
    <!-- Box icon inside center -->
    <path d="M -16 -10 L 0 -19 L 16 -10 L 0 -1 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M -16 -8 L 0 1 L 0 18 L -16 9 Z" fill="#fef3c7"/>
    <path d="M 0 1 L 16 -8 L 16 9 L 0 18 Z" fill="#fde68a"/>
  </g>

  <!-- Banner text below -->
  <rect x="136" y="420" width="240" height="42" rx="8" fill="#f59e0b"/>
  <text x="256" y="448" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">ALMOXARIFADO</text>
</svg>
